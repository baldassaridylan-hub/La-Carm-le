// ---- Outils de construction (coordonnées en pixels du plan)
function floor(x1,y1,x2,y2,color,y=0){
  const w=(x2-x1)/PX,d=(y2-y1)/PX;
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),mat(color));
  m.rotation.x=-Math.PI/2;m.position.set(mx(x1)+w/2,y,mz(y1)+d/2);scene.add(m);return m;
}
const ceilings=new THREE.Group();scene.add(ceilings);
function ceil(x1,y1,x2,y2){
  const w=(x2-x1)/PX,d=(y2-y1)/PX;
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),new THREE.MeshLambertMaterial({color:0xf5f3ee,side:THREE.DoubleSide}));
  m.rotation.x=Math.PI/2;m.position.set(mx(x1)+w/2,H,mz(y1)+d/2);ceilings.add(m);
}
function box(x1,y1,x2,y2,h,color,y0=0){
  const w=(x2-x1)/PX,d=(y2-y1)/PX;
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));
  m.position.set(mx(x1)+w/2,y0+h/2,mz(y1)+d/2);scene.add(m);return m;
}
function wall(x1,y1,x2,y2,opt={}){
  const ax=mx(x1),az=mz(y1),bx=mx(x2),bz=mz(y2);
  const len=Math.hypot(bx-ax,bz-az),t=opt.t||(opt.glass?0.04:0.14);
  const h=opt.glass?2.2:H, y0=opt.glass?0:0;
  const m=new THREE.Mesh(new THREE.BoxGeometry(len+(opt.glass?0:t),h,t),
    opt.glass?new THREE.MeshLambertMaterial({color:0x9fd0e8,transparent:true,opacity:.35}):mat(opt.color||0xf2efe8));
  m.position.set((ax+bx)/2,y0+h/2,(az+bz)/2);
  m.rotation.y=-Math.atan2(bz-az,bx-ax);
  scene.add(m);
  colliders.push([ax,az,bx,bz]);
  if(!opt.glass)wallMeshes.push(m);
  if(false){ // linteau au-dessus des ouvertures : non nécessaire, mur plein
  }
}

{

box(139,39,171,73,1.85,0xe3e5e7);box(139,39,171,73,0.45,W,1.85);     // frigo + placard au-dessus

{

{

// ---- Portes et portes-fenêtres (battants articulés, cliquables)
const doors=[],lintels=[],doorMeshes=[];
// [id, charnière x, y (px), direction fermée dx,dz, sens d'ouverture ox,oz, largeur (px), type, lien]
const DOORS=[
 ['entree',490,14,-1,0,0,1,49,'ext','entree'],

];
const frameMat=mat(0x3a3f44),whiteMat=mat(0xf4f2ee),steelMat=mat(0xb8bec2);
const glassMat=new THREE.MeshLambertMaterial({color:0x9fd0e8,transparent:true,opacity:.35});
function addLeaf(spec){
  const [id,hx,hy,dx,dz,ox,oz,lpx,kind,link]=spec;
  const len=lpx/PX,g=new THREE.Group(),d={id,hx,hy,dx,dz,len,lpx,link,kind,open:false,t:0,grp:g};
  const add=(w,h,t,x,y,z,m)=>{const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,t),m);b.position.set(x,y,z);b.userData.door=d;g.add(b);doorMeshes.push(b);};
  if(kind==='pf'){
    const h=2.15;
    add(len,0.06,0.05,len/2,0.03,0,frameMat);add(len,0.06,0.05,len/2,h-0.03,0,frameMat);
    add(0.05,h,0.05,0.025,h/2,0,frameMat);add(0.05,h,0.05,len-0.025,h/2,0,frameMat);
    add(len-0.08,h-0.1,0.012,len/2,h/2,0,glassMat);add(0.03,0.2,0.07,len-0.07,1.05,0,steelMat);
  }else{
    const h=kind==='ext'?2.1:2.04,m=kind==='ext'?frameMat:whiteMat;
    add(len,h,0.045,len/2,h/2,0,m);add(0.14,0.025,0.1,len-0.1,1.0,0,steelMat);
  }
  g.position.set(mx(hx),0,mz(hy));
  d.c0=-Math.atan2(dz,dx);
  let dl=-Math.atan2(oz,ox)-d.c0;d.dl=Math.atan2(Math.sin(dl),Math.cos(dl));
  g.rotation.y=d.c0;scene.add(g);
  const ax=mx(hx),az=mz(hy);d.col=[ax,az,ax+dx*len,az+dz*len];colliders.push(d.col);
  const bx=hx+dx*lpx,by=hy+dz*lpx,t=3.7;
  const hh=kind==='pf'?0.35:(kind==='ext'?0.4:0.46),y0=kind==='pf'?2.15:(kind==='ext'?2.1:2.04);
  lintels.push(dz===0?box(Math.min(hx,bx),hy-t,Math.max(hx,bx),hy+t,hh,0xf2efe8,y0)
                     :box(hx-t,Math.min(hy,by),hx+t,Math.max(hy,by),hh,0xf2efe8,y0));
  doors.push(d);
}
DOORS.forEach(addLeaf);
function setDoor(d,o){d.open=o;d.col.off=d.keep?false:o;}
const allOpen=()=>doors.every(d=>d.open);
function toggleDoor(d){const o=!d.open;doors.filter(x=>x.link===d.link).forEach(x=>setDoor(x,o));}

{

function updateRoom(p){
  const px=p.x*PX+OX,py=p.z*PX+OY;let n="";
  for(const r of rooms){if(px>=r[1]&&px<=r[3]&&py>=r[2]&&py<=r[4]){n=r[0];break;}}
  if(n&&n!==lastRoom){lastRoom=n;roomEl.textContent=n;}

// ---- Collisions
const R=0.22;
function hit(x,z){
  for(const c of colliders){if(c.off)continue;const [ax,az,bx,bz]=c;
    const dx=bx-ax,dz=bz-az,l2=dx*dx+dz*dz||1e-6;
    let t=((x-ax)*dx+(z-az)*dz)/l2;t=Math.max(0,Math.min(1,t));
    if(Math.hypot(x-(ax+dx*t),z-(az+dz*t))<R+0.07)return true;
  }
  return false;
}

// ---- Modes et caméra
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let mode="orbit",yaw=Math.PI,pitch=0,low=true,ceilOn=false,cotes=false;

function refresh(){
  const w=mode==="walk";
  ceilings.visible=w||ceilOn;
  const sc=(low&&!w)?0.4:1;wallMeshes.forEach(m=>{m.scale.y=sc;m.position.y=H*sc/2;});doors.forEach(d=>d.grp.scale.y=sc);lintels.forEach(m=>m.visible=sc===1);$("bDoors").textContent="Portes : "+(allOpen()?"fermer":"ouvrir");
  $("bCotes").textContent="Cotes : "+(cotes?"masquer":"afficher");

  $("bWalls").textContent="Murs : "+(low?"relever":"abaisser");

  $("walk").classList.toggle("on",w);
  $("bCotes").classList.toggle("on",cotes);
  $("room").style.display=w?"block":"none";

  $("bCeil").style.display=$("bWalls").style.display=w?"none":"block";
}
$("bDoors").onclick=()=>{const o=!allOpen();doors.forEach(d=>setDoor(d,o));refresh();};

// Souris / tactile
const ptr=new Map();let pd=0;
const pinch=()=>{const a=[...ptr.values()];return a.length<2?0:Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);};
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);pd=pinch();});
cv.addEventListener("pointermove",e=>{
  const p=ptr.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p[0],dy=e.clientY-p[1];ptr.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptr.size===2){const d=pinch();if(mode==="orbit"&&pd&&d)g.d=clamp(g.d*pd/d,4,45);pd=d;}
  else if(mode==="orbit"){g.th-=dx*0.006;g.ph=clamp(g.ph-dy*0.005,0.05,1.5);}
  else{yaw-=dx*0.004;pitch=clamp(pitch-dy*0.004,-1.4,1.4);}
});

// Boutons maintenus + clavier
const held={},keys={};
document.querySelectorAll("[data-h]").forEach(b=>{
  b.addEventListener("pointerdown",e=>{e.preventDefault();held[b.dataset.h]=true;});
  ["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,()=>held[b.dataset.h]=false));
});

addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
const k_=c=>keys[c];
const clock=new THREE.Clock();
function frame(){
  const dt=Math.min(clock.getDelta(),0.05);
  doors.forEach(d=>{d.t+=((d.open?1:0)-d.t)*Math.min(1,dt*5);d.grp.rotation.y=d.c0+d.dl*d.t;if(d.sl)d.grp.position.x=d.px+d.sl*d.t;});
  const up=held.tu||k_("ArrowUp")||k_("KeyW")||k_("KeyZ"),dn=held.td||k_("ArrowDown")||k_("KeyS");
  const lf=held.pl||k_("KeyA")||k_("KeyQ"),rt=held.pr||k_("KeyD");
  const tl=held.rl||k_("ArrowLeft"),tr=held.rr||k_("ArrowRight");
  if(mode==="orbit"){
    if(tl)g.th-=dt*1.4;if(tr)g.th+=dt*1.4;
    if(up&&!k_("KeyZ")&&!k_("KeyW")||held.tu)g.ph=clamp(g.ph-dt*1.1,0.05,1.5);
    if(dn)g.ph=clamp(g.ph+dt*1.1,0.05,1.5);
    const sp=g.d*0.6*dt,rx=Math.cos(g.th),rz=-Math.sin(g.th);
    if(rt){g.t.x+=rx*sp;g.t.z+=rz*sp;}if(lf){g.t.x-=rx*sp;g.t.z-=rz*sp;}
    if(held.zi)g.d=clamp(g.d*(1-dt*1.2),4,45);if(held.zo)g.d=clamp(g.d*(1+dt*1.2),4,45);
    const a=1-Math.pow(0.001,dt);
    o.t.lerp(g.t,a);o.th+=(g.th-o.th)*a;o.ph+=(g.ph-o.ph)*a;o.d+=(g.d-o.d)*a;
    camera.position.set(o.t.x+o.d*Math.sin(o.ph)*Math.sin(o.th),o.t.y+o.d*Math.cos(o.ph),o.t.z+o.d*Math.sin(o.ph)*Math.cos(o.th));
    camera.lookAt(o.t);
  }else{
    const sp=(keys.ShiftLeft?3.2:1.6)*dt;
    if(tl)yaw+=dt*1.6;if(tr)yaw-=dt*1.6;
    const f=(up?1:0)-(dn?1:0),s=(rt?1:0)-(lf?1:0);
    const fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
    const dx=(fx*f+rx*s)*sp,dz=(fz*f+rz*s)*sp;
    if(!hit(pos.x+dx,pos.z))pos.x+=dx;
    if(!hit(pos.x,pos.z+dz))pos.z+=dz;
    camera.position.copy(pos);camera.rotation.set(pitch,yaw,0);
    updateRoom(pos);
  }
  labels();
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
// Ouvrir / fermer les portes : clic (ou touche E en visite à pied)
const rc=new THREE.Raycaster();let dn=null;
cv.addEventListener("pointerdown",e=>{dn=[e.clientX,e.clientY];});
cv.addEventListener("pointerup",e=>{
  if(!dn||Math.hypot(e.clientX-dn[0],e.clientY-dn[1])>5)return;
  rc.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1),camera);
  const h=rc.intersectObjects(doorMeshes,false);
  if(h.length)toggleDoor(h[0].object.userData.door);
});
addEventListener("keydown",e=>{
  if(e.code!=="KeyE"||mode!=="walk")return;
  let best=null,bd=1.9;
  doors.forEach(d=>{const x=mx(d.hx+d.dx*d.lpx/2),z=mz(d.hy+d.dz*d.lpx/2),r=Math.hypot(pos.x-x,pos.z-z);if(r<bd){bd=r;best=d;}});
  if(best)toggleDoor(best);
});
